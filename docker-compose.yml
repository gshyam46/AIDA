services:
  model:
    build:
      context: .
      dockerfile: docker/Model.Dockerfile
    volumes:
      - ./.runtime/Qwen3-4B-Instruct-2507-Q4_K_M.gguf:/models/semantic.gguf:ro
    expose:
      - "8000"
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      AIDA_DATA_DIR: /app/data
      AIDA_PUBLIC_DEMO: "${AIDA_PUBLIC_DEMO:-1}"
      AIDA_CONNECTOR_KEY: "${AIDA_CONNECTOR_KEY:-}"
      AIDA_CONNECTOR_HOSTS: "${AIDA_CONNECTOR_HOSTS:-}"
    network_mode: service:model
    depends_on:
      model:
        condition: service_healthy
    volumes:
      - demo-data:/app/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
  frontend:
    build: ./frontend
    ports:
      - "${AIDA_HOST:-127.0.0.1}:${AIDA_PORT:-3000}:3000"
    environment:
      BACKEND_URL: http://model:8000
      AIDA_PUBLIC_DEMO: "${AIDA_PUBLIC_DEMO:-1}"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
volumes:
  demo-data:
